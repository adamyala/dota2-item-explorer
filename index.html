<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dota 2 Item Explorer</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
</head>
<body>
    <header class="page-header">
        <h1>Dota 2 Item Explorer</h1>
        <p class="subtitle">Pick stats to add sortable columns. Click a header to sort, and click a row for details.</p>
    </header>

    <section class="controls">
        <div class="control-row">
            <input id="search" type="search" placeholder="Search items…" autocomplete="off">
            <label class="toggle"><input id="has-active" type="checkbox"> Has active</label>
            <label class="toggle" title="Attributes add their derived stats (Strength → Health, Agility → Armor, etc.)">
                <input id="computed" type="checkbox"> Computed stats
            </label>
        </div>

        <div class="stat-picker">
            <div class="stat-picker-header">
                <strong>Stats</strong>
                <input id="stat-search" type="search" placeholder="Filter stats…" autocomplete="off">
                <button id="clear-stats" type="button" class="link-button">Clear</button>
            </div>
            <div id="stat-chips" class="chips"></div>
        </div>
    </section>

    <p id="status" class="status">Loading items…</p>

    <div class="table-wrap">
        <table id="items">
            <thead></thead>
            <tbody></tbody>
        </table>
    </div>

    <footer>
        <small>
            Data from <a href="https://github.com/odota/dotaconstants">odota/dotaconstants</a>, loaded live.
            Now go rush Dagon!
        </small>
    </footer>
</body>
</html>
